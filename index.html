<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e1c2e">
    <title>バス時刻表</title>
    <style>
        :root {
            --bg: #13121e;
            --surface: #1e1c2e;
            --surface2: #252338;
            --text: #e2dff5;
            --accent: #c9b8ff;
            --highlight: #ffe090;
            --south: #f0889e;
            --now-circle: #ff9f43;
            --selected: #00d2ff;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'BIZ UDPGothic', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
            padding-bottom: calc(90px + env(safe-area-inset-bottom));
            scroll-behavior: smooth;
        }

        /* ── トップカード ── */
        .card {
            background: var(--surface);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 10px;
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        /* 停留所名 */
        .station-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .station-name {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--accent);
        }
        .edit-gear {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--accent);
            border-radius: 50%;
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem;
            cursor: pointer;
            flex-shrink: 0;
        }
        .edit-gear.active { background: rgba(255,75,87,0.2); border-color: #ff4757; color: #ff4757; }

        /* 日付バッジ */
        .day-badge {
            font-size: 0.72rem;
            font-weight: bold;
            color: var(--highlight);
            margin-bottom: 8px;
        }

        /* 平日／休日トグル */
        .day-toggle {
            display: flex;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 12px;
        }
        .tgl-btn {
            flex: 1;
            border: none;
            background: none;
            color: var(--text);
            padding: 7px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.78rem;
            opacity: 0.5;
            cursor: pointer;
            font-family: inherit;
        }
        .tgl-btn.active { background: var(--text); color: var(--bg); opacity: 1; }

        /* 次のバスエリア */
        .next-area {
            background: rgba(201,184,255,0.04);
            border: 1px solid var(--accent);
            border-radius: 14px;
            padding: 12px 14px;
            transition: border-color 0.3s, background 0.3s;
        }
        .next-area.is-selected {
            border-color: var(--selected);
            background: rgba(0,210,255,0.05);
        }
        .next-main {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .next-time {
            font-size: 2.8rem;
            font-weight: bold;
            color: var(--highlight);
            line-height: 1;
        }
        .next-routes {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .route-badge {
            font-size: 0.68rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 5px;
            color: #000;
            white-space: nowrap;
        }
        .countdown {
            font-size: 0.95rem;
            font-weight: bold;
            margin-top: 6px;
            color: var(--text);
        }
        .second-bus {
            font-size: 0.78rem;
            opacity: 0.7;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px dashed rgba(255,255,255,0.1);
            display: none;
        }

        /* ── 時刻表リスト ── */
        .hour-row {
            display: flex;
            align-items: flex-start;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 10px 0;
            scroll-margin-top: 220px;
        }
        .hour-label {
            width: 36px;
            font-weight: bold;
            color: var(--accent);
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .mins-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            flex: 1;
        }
        .min-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 34px;
            padding: 4px 3px;
            border-radius: 8px;
            border: 2px solid transparent;
            opacity: 0.3;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
        }
        .min-box.active { opacity: 1; }
        .min-box.next-hl {
            border-color: var(--now-circle);
            background: rgba(255,159,67,0.1);
        }
        .min-box.sel {
            border-color: var(--selected) !important;
            background: rgba(0,210,255,0.2) !important;
            transform: scale(1.12);
            opacity: 1;
            z-index: 5;
        }
        .min-box.editable { position: relative; }
        .min-box.editable::after {
            content: '×';
            position: absolute;
            top: -5px; right: -5px;
            background: #ff4757;
            color: #fff;
            width: 14px; height: 14px;
            border-radius: 50%;
            font-size: 9px;
            display: flex; align-items: center; justify-content: center;
        }
        .m-val { font-size: 1rem; font-weight: bold; }
        .m-route { font-size: 0.52rem; font-weight: bold; margin-top: -2px; }
        .rt-kita .m-val, .rt-kita .m-route { color: var(--accent); }
        .rt-minami .m-val, .rt-minami .m-route { color: var(--south); }
        .add-btn {
            font-size: 0.72rem;
            color: var(--accent);
            padding: 3px 10px;
            border: 1px dashed var(--accent);
            border-radius: 6px;
            cursor: pointer;
            align-self: center;
        }

        /* ── 設定ドロワー ── */
        .drawer-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 300;
        }
        .drawer-overlay.open { display: block; }
        .drawer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--surface);
            border-radius: 24px 24px 0 0;
            padding: 20px 16px calc(24px + env(safe-area-inset-bottom));
            z-index: 400;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .drawer.open { transform: translateY(0); }
        .drawer-handle {
            width: 40px; height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin: 0 auto 18px;
        }
        .drawer-title {
            font-size: 0.8rem;
            font-weight: bold;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.08em;
            margin-bottom: 14px;
        }
        .drawer-section {
            background: var(--surface2);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .drawer-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 16px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.15s;
        }
        .drawer-item:last-child { border-bottom: none; }
        .drawer-item:active { background: rgba(255,255,255,0.06); }
        .drawer-item.danger { color: #ff6b6b; }
        .drawer-icon { font-size: 1.1rem; width: 24px; text-align: center; flex-shrink: 0; }
        .drawer-label { font-size: 0.9rem; font-weight: bold; flex: 1; }
        .drawer-sub { font-size: 0.7rem; opacity: 0.5; }

        /* トースト */
        .toast {
            position: fixed;
            top: 20px; left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: var(--surface2);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            z-index: 999;
            transition: transform 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
            white-space: nowrap;
            pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.ok { border-color: rgba(126,255,178,0.4); color: #7effb2; }
        .toast.ng { border-color: rgba(255,107,107,0.4); color: #ff6b6b; }

        /* ── フッターナビ ── */
        .footer-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(19,18,30,0.97);
            padding: 10px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            display: flex;
            gap: 10px;
            z-index: 200;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .btn {
            flex: 1;
            padding: 13px;
            border-radius: 12px;
            border: 1px solid rgba(201,184,255,0.3);
            font-weight: bold;
            background: var(--surface2);
            color: var(--text);
            font-family: inherit;
            font-size: 0.88rem;
            cursor: pointer;
        }
        .btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    </style>
</head>
<body>

<div class="card">
    <div class="station-row">
        <div class="station-name" id="st-display">厚板事務所前</div>
        <div class="edit-gear" id="edit-gear" onclick="openDrawer()">⚙️</div>
    </div>
    <div class="day-badge" id="day-badge">判定中...</div>
    <div class="day-toggle">
        <button id="tgl-h" class="tgl-btn" onclick="setDayMode('h')">平日ダイヤ</button>
        <button id="tgl-k" class="tgl-btn" onclick="setDayMode('k')">休日ダイヤ</button>
    </div>
    <div class="next-area" id="next-area">
        <div class="next-main">
            <div class="next-time" id="next-t">--:--</div>
            <div class="next-routes" id="next-routes"></div>
        </div>
        <div class="countdown" id="count">お待ちください</div>
        <div class="second-bus" id="second-info"></div>
    </div>
</div>

<div id="list"></div>

<!-- 設定ドロワー -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
    <div class="drawer-handle"></div>
    <div class="drawer-title">⚙️ 設定・ダイヤ管理</div>

    <div class="drawer-section">
        <div class="drawer-item" onclick="startEditMode()">
            <div class="drawer-icon">✏️</div>
            <div>
                <div class="drawer-label">時刻の編集モード</div>
                <div class="drawer-sub">時刻の追加・削除ができます</div>
            </div>
        </div>
    </div>

    <div class="drawer-section">
        <div class="drawer-item" onclick="exportCSV()">
            <div class="drawer-icon">📤</div>
            <div>
                <div class="drawer-label">CSVエクスポート</div>
                <div class="drawer-sub">全データをCSVファイルに書き出す</div>
            </div>
        </div>
        <div class="drawer-item" onclick="document.getElementById('csv-input').click()">
            <div class="drawer-icon">📥</div>
            <div>
                <div class="drawer-label">CSVインポート</div>
                <div class="drawer-sub">CSVを読み込んで時刻表を更新</div>
            </div>
        </div>
    </div>

    <div class="drawer-section">
        <div class="drawer-item danger" onclick="resetToDefault()">
            <div class="drawer-icon">🔄</div>
            <div>
                <div class="drawer-label">初期データに戻す</div>
                <div class="drawer-sub">編集内容をすべてリセット</div>
            </div>
        </div>
    </div>
</div>
<input type="file" id="csv-input" accept=".csv,text/csv" style="display:none" onchange="importCSV(event)">

<!-- トースト -->
<div class="toast" id="toast"></div>

<div class="footer-nav">
    <button id="btn-atsu" class="btn active" onclick="setStation('atsu')">厚板事務所前</button>
    <button id="btn-wada" class="btn" onclick="setStation('wada')">渡田西門前</button>
</div>

// ==================== 祝日判定（オフライン対応） ====================
function checkHoliday() {
    const now = new Date();
    const y = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const todayStr = `${y}-${mm}-${dd}`;
    const dow = now.getDay();
    let isHoliday = (dow === 0 || dow === 6);
    const holidayName = HOLIDAYS[todayStr] || '';
    if (holidayName) isHoliday = true;

    dayMode = isHoliday ? 'k' : 'h';
    const badge = document.getElementById('day-badge');
    if (holidayName) {
        badge.innerText = `【祝日: ${holidayName}】`;
        badge.style.color = 'var(--south)';
    } else {
        badge.innerText = isHoliday ? '今日は休日ダイヤです 🏠' : '今日は平日ダイヤです 👔';
        badge.style.color = isHoliday ? 'var(--highlight)' : 'var(--accent)';
    }
    update();
}

// ==================== 描画 ====================
function update() {
    const now = new Date();
    const h = now.getHours(), m = now.getMinutes();

    document.getElementById('st-display').innerText = currentSt === 'atsu' ? '厚板事務所前' : '渡田西門前';
    document.getElementById('tgl-h').classList.toggle('active', dayMode === 'h');
    document.getElementById('tgl-k').classList.toggle('active', dayMode === 'k');
    const gear = document.getElementById('edit-gear');
    gear.classList.toggle('active', isEditMode);
    gear.onclick = isEditMode ? toggleEditMode : openDrawer;
    gear.title = isEditMode ? '編集終了・保存' : '設定';
    gear.innerText = isEditMode ? '✅' : '⚙️';

    const sorted = [...db[currentSt][dayMode]].sort((a, b) => (a.h * 60 + a.m) - (b.h * 60 + b.m));
    const futures = sorted.filter(b => b.h * 60 + b.m > h * 60 + m);
    const next = futures[0] || null;
    const second = next ? futures.find(b => b.h * 60 + b.m > next.h * 60 + next.m) : null;

    // 時刻表描画
    const listDiv = document.getElementById('list');
    listDiv.innerHTML = '';
    let targetRow = null;

    for (let hour = 5; hour <= 23; hour++) {
        const mins = sorted.filter(b => b.h === hour);
        if (!mins.length && !isEditMode) continue;

        const row = document.createElement('div');
        row.className = 'hour-row';
        const wrap = document.createElement('div');
        wrap.className = 'mins-wrap';
        row.appendChild(Object.assign(document.createElement('div'), { className: 'hour-label', innerText: hour }));

        mins.forEach(item => {
            const isFuture = item.h * 60 + item.m > h * 60 + m;
            const isNext = next && item.h === next.h && item.m === next.m && item.r === next.r;
            const isSel = selectedBus && item.h === selectedBus.h && item.m === selectedBus.m && item.r === selectedBus.r;
            const box = document.createElement('div');
            box.className = [
                'min-box',
                item.r === '北' ? 'rt-kita' : 'rt-minami',
                isFuture ? 'active' : '',
                isNext ? 'next-hl' : '',
                isSel ? 'sel' : '',
                isEditMode ? 'editable' : ''
            ].filter(Boolean).join(' ');
            box.innerHTML = `<div class="m-val">${String(item.m).padStart(2,'0')}</div><div class="m-route">${item.r}</div>`;
            box.onclick = () => isEditMode ? removeTime(item) : (isFuture && selectBus(item));
            wrap.appendChild(box);
            if (isNext) targetRow = row;
        });

        if (isEditMode) {
            const addBtn = document.createElement('div');
            addBtn.className = 'add-btn';
            addBtn.innerText = '＋ 追加';
            addBtn.onclick = () => addTime(hour);
            wrap.appendChild(addBtn);
        }

        row.appendChild(wrap);
        listDiv.appendChild(row);
    }

    // 次のバス表示
    const displayBus = selectedBus || next;
    const nextArea = document.getElementById('next-area');
    nextArea.classList.toggle('is-selected', !!selectedBus);

    if (displayBus) {
        document.getElementById('next-t').innerText = `${displayBus.h}:${String(displayBus.m).padStart(2,'0')}`;

        let routesHTML = '';
        if (selectedBus) {
            const color = selectedBus.r === '北' ? 'var(--accent)' : 'var(--south)';
            routesHTML = `<span class="route-badge" style="background:${color};">${selectedBus.r}周り (選)</span>`;
        } else {
            const same = sorted.filter(b => b.h === displayBus.h && b.m === displayBus.m);
            routesHTML = same.map(b => {
                const color = b.r === '北' ? 'var(--accent)' : 'var(--south)';
                return `<span class="route-badge" style="background:${color};">${b.r}周り</span>`;
            }).join('');
        }
        document.getElementById('next-routes').innerHTML = routesHTML;

        const diffMin = Math.ceil((new Date().setHours(displayBus.h, displayBus.m, 0, 0) - now) / 60000);
        document.getElementById('count').innerText = `あと ${diffMin} 分`;

        const secEl = document.getElementById('second-info');
        if (second && !selectedBus) {
            secEl.innerText = `次は ${second.h}:${String(second.m).padStart(2,'0')} (${second.r}周り)`;
            secEl.style.display = 'block';
        } else {
            secEl.style.display = 'none';
        }

        if (!initialScrollDone && targetRow) {
            setTimeout(() => { targetRow.scrollIntoView({ behavior: 'smooth', block: 'start' }); initialScrollDone = true; }, 300);
        }
    } else {
        document.getElementById('next-t').innerText = '--:--';
        document.getElementById('next-routes').innerHTML = '';
        document.getElementById('count').innerText = '運行終了';
        document.getElementById('second-info').style.display = 'none';
    }
}

// ==================== 操作 ====================
function setStation(id) {
    currentSt = id;
    selectedBus = null;
    initialScrollDone = false;
    document.getElementById('btn-atsu').classList.toggle('active', id === 'atsu');
    document.getElementById('btn-wada').classList.toggle('active', id === 'wada');
    update();
}
function setDayMode(mode) {
    dayMode = mode;
    selectedBus = null;
    initialScrollDone = false;
    update();
}
function selectBus(bus) {
    selectedBus = (selectedBus && selectedBus.h === bus.h && selectedBus.m === bus.m && selectedBus.r === bus.r) ? null : bus;
    update();
}
function toggleEditMode() {
    isEditMode = !isEditMode;
    if (isEditMode) selectedBus = null;
    update();
    if (!isEditMode) {
        localStorage.setItem('bus_db_v2', JSON.stringify(db));
        showToast('💾 保存しました', 'ok');
    }
}
function addTime(hour) {
    const min = prompt(`${hour}時台の何分？（0〜59）`);
    if (min === null || min === '' || isNaN(min)) return;
    const route = confirm('OK → 北周り　 キャンセル → 南周り') ? '北' : '南';
    db[currentSt][dayMode].push({ h: hour, m: parseInt(min), r: route });
    update();
}
function removeTime(item) {
    if (!confirm(`${item.h}:${String(item.m).padStart(2,'0')} ${item.r}周り を削除しますか？`)) return;
    db[currentSt][dayMode] = db[currentSt][dayMode].filter(b => !(b.h === item.h && b.m === item.m && b.r === item.r));
    update();
}

// ==================== 設定ドロワー ====================
function openDrawer() {
    document.getElementById('drawer').classList.add('open');
    document.getElementById('drawer-overlay').classList.add('open');
}
function closeDrawer() {
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawer-overlay').classList.remove('open');
}
function startEditMode() {
    closeDrawer();
    isEditMode = true;
    selectedBus = null;
    update();
}

// ==================== CSVエクスポート ====================
function exportCSV() {
    closeDrawer();
    const rows = ['停留所,平日休日,時,分,路線'];
    ['atsu','wada'].forEach(st => {
        ['h','k'].forEach(d => {
            db[st][d].forEach(item => {
                rows.push(`${st},${d},${item.h},${item.m},${item.r}`);
            });
        });
    });
    const blob = new Blob(['\uFEFF' + rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'bus_timetable.csv';
    a.click();
    URL.revokeObjectURL(url);
    showToast('📤 CSVを書き出しました', 'ok');
}

// ==================== CSVインポート ====================
function importCSV(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const text = e.target.result.replace(/^\uFEFF/, '');
            const lines = text.split('\n').map(l => l.trim()).filter(l => l);
            const startIdx = lines[0].startsWith('停留所') ? 1 : 0;
            const newData = { atsu: { h:[], k:[] }, wada: { h:[], k:[] } };
            for (let i = startIdx; i < lines.length; i++) {
                const [st, d, hStr, mStr, r] = lines[i].split(',').map(c => c.trim());
                if (!newData[st] || !newData[st][d]) continue;
                const h = parseInt(hStr), m = parseInt(mStr);
                if (isNaN(h) || isNaN(m)) continue;
                newData[st][d].push({ h, m, r });
            }
            const total = Object.values(newData).flatMap(s => Object.values(s)).flat().length;
            if (total === 0) throw new Error('empty');
            db = newData;
            localStorage.setItem('bus_db_v2', JSON.stringify(db));
            update();
            showToast(`📥 ${total}件を取り込みました`, 'ok');
        } catch(err) {
            showToast('❌ 読み込みに失敗しました', 'ng');
        }
        event.target.value = '';
    };
    reader.readAsText(file, 'UTF-8');
}

// ==================== リセット ====================
function resetToDefault() {
    if (!confirm('初期データに戻しますか？\n編集した内容はすべて消えます。')) return;
    db = JSON.parse(JSON.stringify(DEFAULT_DATA));
    localStorage.setItem('bus_db_v2', JSON.stringify(db));
    closeDrawer();
    update();
    showToast('🔄 初期データに戻しました', 'ok');
}

// ==================== トースト ====================
function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + type;
    requestAnimationFrame(() => {
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    });
}
